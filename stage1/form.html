<script nonce="">

$('#zone_name').keydown(function () {
    $('#zone_id').val("");
});

$('#zone_name').autocomplete({
    minLength: 1,
    maxResults: 100,
    'source': function (request, response) {
        $.post("/api/planned_works/autocomplete_zones.php", {
            zone_name: request.term,
            database_id: 3210			}, function (data) {
            response(data);
        }, 'json');
    },
    'focus': function () {
        return false;
    },
    'select': function (event, ui) {
        event.preventDefault();

        $(this).val(ui.item.label);
        $('#zone_id').val(ui.item.value);

        return false;
    }
});

$("input[name='default_invoice_address']").on('click', function () {
    $("input[name='default_invoice_address']").each(function () {
        $(this).prop('checked', false);
    });
    $(this).prop('checked', true);
});
</script>
